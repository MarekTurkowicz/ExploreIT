name: CI

on:
  push:  # every branch, so work in progress is checked too
  pull_request:

env:
  # Use uv's own Python builds, which include Tk, even when the runner has Python too.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # uv's own Python builds include Tk, which the desktop application tests need.
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # The desktop application tests need a display; xvfb provides a virtual one.
        run: |
          set -o pipefail
          xvfb-run --auto-servernum uv run pytest --cov 2>&1 | tee pytest.log

      - name: Show why the tests failed
        if: failure()
        run: |
          tail -n 40 pytest.log | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' \
            | xargs -0 -I{} echo "::error title=pytest::{}"
