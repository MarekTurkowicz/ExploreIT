[project]
name = "exploreit"
version = "0.1.0"
description = "Web structure exploration: crawling, link graph analysis and content storage."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marek Turkowicz" }]
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "pyvis>=0.3.2",
    "matplotlib>=3.11.2",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydantic>=2.14.1",
    "textual>=8.2.8",
]

[project.scripts]
exploreit = "exploreit.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "types-networkx>=3.6.1.20261021",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exploreit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyvis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["exploreit"]
omit = ["*/cli.py"]
